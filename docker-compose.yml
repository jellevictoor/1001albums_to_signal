services:
  signal:
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      - MODE=json-rpc-native
    ports:
      - "8082:8080"
    volumes:
      - signal-data:/home/.local/share/signal-cli
      # Debug instrumentation: starts the signal-cli daemon with --verbose
      - ./signal-cli-verbose.sh:/usr/local/bin/signal-cli-native:ro
    restart: unless-stopped
    networks:
      - album-net

  album-bot:
    image: ghcr.io/jellevictoor/1001albums_to_signal:latest
    depends_on:
      - signal
    environment:
      - ALBUMS_PROJECT_NAME=${ALBUMS_PROJECT_NAME}
      - SIGNAL_PHONE_NUMBER=${SIGNAL_PHONE_NUMBER}
      - SIGNAL_GROUP_ID=${SIGNAL_GROUP_ID}
      - SIGNAL_API_URL=http://signal:8080
    volumes:
      - bot-data:/data
      # Read-write: the bot repairs signal-cli's sender-key state when a group send hangs
      - signal-data:/signal-cli
    networks:
      - album-net
    profiles:
      - manual

  scheduler:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    environment:
      - TZ=Europe/Brussels
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.album-bot.schedule: "${SCHEDULE:-0 0 7 * * *}"
      ofelia.job-run.album-bot.image: "ghcr.io/jellevictoor/1001albums_to_signal:latest"
      ofelia.job-run.album-bot.network: "1001albums_to_signal_album-net"
      ofelia.job-run.album-bot.environment: '["ALBUMS_PROJECT_NAME=${ALBUMS_PROJECT_NAME}", "SIGNAL_PHONE_NUMBER=${SIGNAL_PHONE_NUMBER}", "SIGNAL_GROUP_ID=${SIGNAL_GROUP_ID}", "SIGNAL_API_URL=http://signal:8080"]'
      ofelia.job-run.album-bot.volume: '["1001albums_to_signal_bot-data:/data", "1001albums_to_signal_signal-data:/signal-cli"]'
      ofelia.job-run.album-bot.delete: "true"
      ofelia.job-run.rating-check.schedule: "${RATING_SCHEDULE:-0 0 12,18,22 * * *}"
      ofelia.job-run.rating-check.image: "ghcr.io/jellevictoor/1001albums_to_signal:latest"
      ofelia.job-run.rating-check.network: "1001albums_to_signal_album-net"
      ofelia.job-run.rating-check.command: "python check_ratings.py"
      ofelia.job-run.rating-check.environment: '["ALBUMS_PROJECT_NAME=${ALBUMS_PROJECT_NAME}", "SIGNAL_PHONE_NUMBER=${SIGNAL_PHONE_NUMBER}", "SIGNAL_GROUP_ID=${SIGNAL_GROUP_ID}", "SIGNAL_API_URL=http://signal:8080"]'
      ofelia.job-run.rating-check.volume: '["1001albums_to_signal_bot-data:/data", "1001albums_to_signal_signal-data:/signal-cli"]'
      ofelia.job-run.rating-check.delete: "true"

networks:
  album-net:

volumes:
  signal-data:
  bot-data:
